<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">TimeSink — Know where your day goes</title>
<desc id="desc">An editorial feature poster, not an app screenshot. Automatic app and website tracking, activity analysis, budgets and focus sessions. Native macOS app with local storage and optional cloud sync.</desc>
<rect width="1600" height="1000" fill="#f5f5f0"/>
<g font-family="Avenir Next, Avenir, sans-serif" fill="#172b27">
<text x="88" y="132" font-size="52" font-weight="600" letter-spacing="-1">TimeSink</text>
<text x="1512" y="124" text-anchor="end" font-size="24" fill="#52635d">Built for macOS</text>
<path d="M88 174H1512" stroke="#bcc6bd"/>
<text x="80" y="326" font-size="108" font-weight="600" letter-spacing="-3">Know where</text>
<text x="80" y="448" font-size="108" font-weight="600" letter-spacing="-3">your day goes.</text>
<text x="88" y="527" font-size="30" fill="#52635d">Automatic time tracking. A clearer view of your work.</text>
<path d="M88 608H1512" stroke="#bcc6bd"/>
<text x="88" y="681" font-size="36" font-weight="600">Track naturally.</text>
<text x="88" y="737" font-size="25" fill="#52635d">Apps, windows, and websites.</text>
<text x="88" y="776" font-size="25" fill="#52635d">Captured as you work.</text>
<text x="584" y="681" font-size="36" font-weight="600">See the patterns.</text>
<text x="584" y="737" font-size="25" fill="#52635d">Categories, trends, and history.</text>
<text x="584" y="776" font-size="25" fill="#52635d">Understand where time went.</text>
<text x="1080" y="681" font-size="36" font-weight="600">Make room to focus.</text>
<text x="1080" y="737" font-size="25" fill="#52635d">Daily budgets and focus sessions.</text>
<text x="1080" y="776" font-size="25" fill="#52635d">Give attention a boundary.</text>
<path d="M88 865H1512" stroke="#bcc6bd"/>
<text x="88" y="927" font-size="23" fill="#52635d">Native SwiftUI · Local storage · Optional cloud sync</text>
<text x="1512" y="927" text-anchor="end" font-size="23" fill="#52635d">samsara0xgg / timesink</text>
</g>
