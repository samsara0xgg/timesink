# A change under cloud/ that reaches main is deployed. GitHub proves who it
# is with a short-lived OIDC token; AWS_DEPLOY_ROLE_ARN (a repository
# variable) names the role in cloud/infra/lib/github-stack.ts that trusts
# exactly this repository's main branch. No AWS keys are stored anywhere.
#
# Only the TimeSink stack is deployed here. The GitHub stack that grants
# this access is deployed by hand on purpose: a pipeline must not be able to
# widen its own trust.
#
# Dependencies are installed before AWS credentials exist in the job and
# without install scripts (none of them needs one: the Lambda is plain
# Python, nothing is bundled), and actions are pinned to commits.
#
# Optional repository variables, passed to the stack as CDK context (see
# cloud/infra/lib/timesink-stack.ts); unset means off:
#   SES_FROM_EMAIL (+ SES_FROM_NAME, SES_REPLY_TO, SES_REGION,
#   SES_VERIFIED_DOMAIN)  sign-up mail through SES, past Cognito's 50 a day
#   API_RESERVED_CONCURRENCY  caps the API Lambda's concurrency
name: Deploy cloud

on:
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write
  contents: read

concurrency: deploy-cloud

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloud/infra/package-lock.json
      - run: npm ci --ignore-scripts
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2
      # The budget alert's address is a secret so it never enters the
      # repository or the logs.
      - run: >-
          npx cdk deploy TimeSink --require-approval never
          --parameters AlertEmail=${{ secrets.ALERT_EMAIL }}
          -c sesFromEmail="$SES_FROM_EMAIL" -c sesFromName="$SES_FROM_NAME"
          -c sesReplyTo="$SES_REPLY_TO" -c sesRegion="$SES_REGION"
          -c sesVerifiedDomain="$SES_VERIFIED_DOMAIN"
          -c apiReservedConcurrency="$API_RESERVED_CONCURRENCY"
        env:
          SES_FROM_EMAIL: ${{ vars.SES_FROM_EMAIL }}
          SES_FROM_NAME: ${{ vars.SES_FROM_NAME }}
          SES_REPLY_TO: ${{ vars.SES_REPLY_TO }}
          SES_REGION: ${{ vars.SES_REGION }}
          SES_VERIFIED_DOMAIN: ${{ vars.SES_VERIFIED_DOMAIN }}
          API_RESERVED_CONCURRENCY: ${{ vars.API_RESERVED_CONCURRENCY }}
